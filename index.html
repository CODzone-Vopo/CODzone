<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #141923;
            --accent-turquoise: #00c4b4;
            --accent-gold: #d4af37;
            --accent-red: #ff3333;
            --text-white: #ffffff;
            --text-muted: #8a94a6;
            --border-color: #202736;
        }

        * { box-sizing: border-box; font-family: 'Black Ops One', cursive, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-white); padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; }
        
        /* Header & Logo */
        .header { text-align: center; margin-bottom: 0px; padding: 5px 0; }
        .logo-img { max-width: 300px; height: auto; margin-bottom: 5px; }
        
        /* Died Button */
        .btn-died-container { text-align: center; margin-bottom: 15px; }
        .btn-died {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #b30000;
            background: linear-gradient(135deg, #ff3333, #b30000);
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3);
        }
        .btn-died:active { transform: scale(0.98); }
        .btn-died:hover { background: linear-gradient(135deg, #ff4d4d, #cc0000); }

        /* Daily Fact Card */
        .daily-fact-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15);
        }
        .daily-fact-title {
            color: var(--accent-gold);
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .daily-fact-text {
            color: var(--text-white);
            font-size: 13px;
            line-height: 1.5;
            font-family: sans-serif;
            font-weight: normal;
        }

        /* Navigation Tabs */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px 5px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-muted); font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; transition: 0.2s; text-align: center; }
        .tab-btn.active { background: var(--accent-turquoise); color: #000; border-color: var(--accent-turquoise); }

        /* Sections Visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Cards & Form */
        .card { background: var(--card-bg); border-radius: 12px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--accent-turquoise); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #1c2331; color: var(--text-white); font-size: 15px; margin-bottom: 15px; outline: none; }
        select:focus { border-color: var(--accent-turquoise); }
        
        /* Action Buttons */
        .btn-build { width: 100%; padding: 14px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--accent-turquoise), #009688); color: #000; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.2s; }
        .btn-build:active { transform: scale(0.98); }
        .btn-build:disabled { background: #2a3447; color: #5a6578; cursor: not-allowed; transform: none; }

        /* META Cards Styling */
        .meta-list { display: flex; flex-direction: column; gap: 15px; }
        .meta-card { background: #1c2331; border: 2px solid var(--accent-gold); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .meta-card:active { transform: scale(0.98); }
        .meta-card:hover { border-color: var(--accent-turquoise); }
        .meta-title { color: var(--text-white); font-size: 20px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .meta-img-box { background: #0e121a; border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px dashed var(--border-color); min-height: 90px; display: flex; align-items: center; justify-content: center; }
        .meta-img-box img { max-width: 100%; max-height: 100px; object-fit: contain; }
        .meta-action { color: var(--accent-turquoise); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        /* Quiz Specific Styling */
        .quiz-question-block { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .quiz-question-block:last-child { border-bottom: none; margin-bottom: 10px; }
        .quiz-q-num { color: var(--accent-gold); font-size: 12px; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .quiz-q-text { color: var(--text-white); font-size: 14px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }

        /* Output / Result Box */
        .result-box { display: none; border-top: 3px solid var(--accent-gold); }
        .section-title { color: var(--accent-gold); font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 3px; text-transform: uppercase; }
        .style-badge { text-align: center; font-size: 12px; color: var(--accent-turquoise); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .style-desc-box { background: #1c2331; border-radius: 8px; padding: 15px; border-left: 3px solid var(--accent-gold); color: var(--text-muted); font-size: 14px; line-height: 1.5; }

        /* Weapon Image Container */
        .weapon-img-box { text-align: center; margin-bottom: 15px; min-height: 100px; display: flex; align-items: center; justify-content: center; background: #0e121a; border-radius: 8px; padding: 10px; border: 1px dashed var(--border-color); }
        .weapon-img-box img { max-width: 100%; max-height: 120px; object-fit: contain; }

        /* Attachments & Perks List */
        .att-list, .perks-list { list-style: none; }
        .att-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .att-item:last-child { border-bottom: none; }
        .att-slot { color: var(--text-muted); font-weight: 600; }
        .att-name { color: var(--text-white); font-weight: bold; text-align: right; }

        /* Perk Card styling */
        .perk-card { padding: 12px; background: #1c2331; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--accent-turquoise); }
        .perk-card:last-child { margin-bottom: 0; }
        .perk-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .perk-slot { color: var(--accent-gold); font-size: 12px; text-transform: uppercase; }
        .perk-name { color: var(--text-white); font-size: 15px; }
        .perk-desc-list { list-style: none; padding-left: 0; margin-top: 5px; }
        .perk-desc-list li { color: var(--text-muted); font-size: 13px; line-height: 1.5; }

        /* Modal / Popup Box */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-red);
            border-radius: 12px;
            padding: 25px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.5);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: var(--accent-red);
            font-size: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-text {
            color: var(--text-white);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .modal-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER WITH LOGO -->
        <div class="header">
            <img src="images/logo.png" alt="WarHub Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
            <h1 id="alt-logo" style="display:none; color: var(--accent-turquoise); font-size: 28px;">War<span style="color: var(--accent-gold);">Hub</span></h1>
        </div>

        <!-- I JUST DIED BUTTON -->
        <div class="btn-died-container">
            <button class="btn-died" onclick="showDiedReason()">!I Just Died!</button>
        </div>

        <!-- DAILY FACT CARD -->
        <div class="daily-fact-card">
            <div class="daily-fact-title">💡 DAILY COD FACT 💡</div>
            <div id="daily-fact-text" class="daily-fact-text">Loading daily fact...</div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="nav-tabs">
            <button id="tab-meta-btn" class="tab-btn active" onclick="switchTab('meta')">META</button>
            <button id="tab-loadout-btn" class="tab-btn" onclick="switchTab('loadout')">Loadouts</button>
            <button id="tab-perks-btn" class="tab-btn" onclick="switchTab('perks')">Perks</button>
            <button id="tab-quiz-btn" class="tab-btn" onclick="switchTab('quiz')">Find Your Style</button>
        </div>

        <!-- META SECTION -->
        <div id="section-meta" class="tab-content active">
            <div class="card">
                <div class="section-title" style="margin-bottom: 15px;">TOP META WEAPONS</div>
                <div id="meta-container" class="meta-list">
                    <!-- META zbrane sa dopĺňajú automaticky z JavaScriptu -->
                </div>
            </div>
        </div>

        <!-- LOADOUT SECTION -->
        <div id="section-loadout" class="tab-content">
            <div class="card">
                <label for="category">1. Category:</label>
                <select id="category" onchange="updateWeaponList()">
                    <option value="ar">Assault Rifles (AR)</option>
                    <option value="smg">Submachine Guns (SMG)</option>
                    <option value="sniper">Sniper Rifles</option>
                </select>

                <label for="weapon">2. Weapon:</label>
                <select id="weapon">
                    <!-- Zbrane sa dopĺňajú automaticky z JavaScriptu -->
                </select>

                <label for="style">3. Your Playstyle:</label>
                <select id="style">
                    <option value="precision">Precision</option>
                    <option value="aggressive">Aggressive</option>
                    <option value="movement">Movement</option>
                    <option value="camping">Camping</option>
                </select>

                <button class="btn-build" onclick="generateLoadout()">Generate Loadout 🔥</button>
            </div>

            <!-- LOADOUT RESULTS CARD -->
            <div id="result" class="card result-box">
                <div id="w-title" class="section-title">AN-94</div>
                <div id="w-style" class="style-badge">PRECISION BUILD</div>

                <!-- Obrázok zbrane -->
                <div class="weapon-img-box">
                    <img id="w-img" src="" alt="Weapon Image" onerror="this.src='https://via.placeholder.com/300x100/141923/00c4b4?text=Weapon+Image'">
                </div>

                <!-- Zoznam Attachmentov -->
                <div id="att-container" class="att-list"></div>
            </div>
        </div>

        <!-- PERKS SECTION -->
        <div id="section-perks" class="tab-content">
            <div class="card">
                <label for="perk-style">Select Your Playstyle:</label>
                <select id="perk-style">
                    <option value="precision">Precision</option>
                    <option value="aggressive">Aggressive</option>
                    <option value="movement">Movement</option>
                    <option value="camping">Camping</option>
                </select>

                <button class="btn-build" onclick="generatePerks()">Get Perk Setup ⚡</button>
            </div>

            <!-- PERKS RESULTS CARD -->
            <div id="perk-result" class="card result-box">
                <div id="p-style-title" class="section-title">PRECISION</div>
                <div class="style-badge">RECOMMENDED PERKS</div>

                <div id="perks-container" class="perks-list"></div>
            </div>
        </div>

        <!-- FIND YOUR STYLE (QUIZ) SECTION -->
        <div id="section-quiz" class="tab-content">
            <div class="card">
                <div id="quiz-questions-container">
                    <!-- 10 otázok sa vygeneruje cez JavaScript -->
                </div>
                <button id="quiz-submit-btn" class="btn-build" onclick="calculateQuizResult()" disabled>Complete All Questions</button>
            </div>

            <!-- QUIZ RESULT CARD -->
            <div id="quiz-result" class="card result-box">
                <div id="q-style-title" class="section-title">YOUR PLAYSTYLE</div>
                <div class="style-badge">PLAYSTYLE ANALYSIS</div>
                <div id="q-style-desc" class="style-desc-box"></div>
            </div>
        </div>

    </div>

    <!-- MODAL POPUP PRE DIED REASONS -->
    <div id="died-modal" class="modal-overlay" onclick="closeDiedModal(event)">
        <div class="modal-card">
            <div class="modal-title">⚠️ DEATH EXCUSE ⚠️</div>
            <div id="died-text" class="modal-text"></div>
            <button class="modal-btn" onclick="closeDiedModalForce()">OK, NEXT GAME</button>
        </div>
    </div>

    <script>
        // LIST OF DAILY COD FACTS
        const dailyFacts = [
            "The \"MoH Killer\" Codename: Before it had an official title, the original 2003 Call of Duty was internally codenamed \"MOH Killer\" (Medal of Honor Killer) by Infinity Ward developers, as many of them had just left 2015, Inc. after making Medal of Honor: Allied Assault.",
            "Captain Price’s WWII Roots: Captain Price originally debuted in the 1944-set original Call of Duty (2003) as a British commando before being reimagined for the Modern Warfare sub-series.",
            "Health Packs in CoD 1: Unlike modern titles, health did not automatically regenerate in the 2003 original; players had to hunt for health packs scattered around the maps.",
            "Shipment Was Born by Accident: The iconic map Shipment was originally designed purely as a tiny internal testing space for combat mechanics before developers accidentally left it coded into CoD 4.",
            "The Cancelled Roman CoD: Activision once funded a prototype called Call of Duty: Roman Warfare, where players would fight in the first-person perspective as a Roman legionnaire.",
            "Craig Fairbrass' Voice Roles: Actor Craig Fairbrass voiced two major iconic characters across the original Modern Warfare trilogy—Gaz (CoD4) and Ghost (MW2)—and provided additional voice work for Sgt. Wallcroft in MW3.",
            "Ghost’s Real Face: In the game files of Modern Warfare II (2022), unmasking Ghost reveals a fully modeled character face rendered under his balaclava based on his voice actor, Samuel Roukin.",
            "Gary Oldman as Reznov: Oscar-winning actor Gary Oldman voiced Viktor Reznov in both World at War and Black Ops 1.",
            "Ice Cube in Black Ops: Rapper Ice Cube voiced the operative Joseph Bowman in the original Black Ops campaign.",
            "Kit Harington as a Villain: Game of Thrones star Kit Harington played the main antagonist, Salen Kotch, in Call of Duty: Infinite Warfare.",
            "James C. Burns and Lore: James C. Burns, who voiced Frank Woods in BO1 and BO2, actively ran a YouTube channel answering fan lore questions for years.",
            "Nazi Zombies Origins: Nazi Zombies in World at War (2008) started as an unapproved side project made by developer Jesse Snyder and a small team at Treyarch. Leadership almost scrapped it before realizing how fun it was.",
            "Unannounced Ending Jump: Completing World at War’s campaign launched players straight into the map Nacht der Untoten with no warning before the full credits rolled.",
            "JFK and Fidel Castro: In Black Ops 1's \"Five\" Zombies map, players could play as John F. Kennedy, Richard Nixon, Robert McNamara, or Fidel Castro.",
            "Dead Ops Arcade: Players could break out of their interrogation chair in the Black Ops 1 main menu to access a terminal and unlock a retro top-down shooter minigame called Dead Ops Arcade.",
            "Ray Gun Easter Egg: On the World at War campaign mission \"Little Resistance,\" stepping into specific water puddles in a precise sequence forced giant stone statues to rise and grant you Ray Guns.",
            "Third-Person Mode: Modern Warfare 2 (2009) included dedicated 3rd-person playlists that shifted the camera behind the player's shoulder.",
            "Shepherd’s Revolver in \"Loose Ends\": In the classic MW2 mission, right before Shepherd shoots Ghost, his revolver cylinder is already indexed to show the live round ready to fire.",
            "The Name \"No Russian\": The infamous MW2 level got its name from Makarov's strict instruction to his squad: \"Remember, no Russian\"—meaning do not speak the language so the massacre would be pinned on the US.",
            "Skipping \"No Russian\": Due to its intense subject matter, Infinity Ward added an option allowing players to skip the \"No Russian\" mission without any gameplay penalty or loss of achievements.",
            "First Choice-Based Narrative: Black Ops II was the very first game in the franchise to feature branching story paths and multiple distinct campaign endings based on player decisions.",
            "Jimmy Kimmel's Cameo: Late-night host Jimmy Kimmel made a secret cameo appearance in one of the branching narrative endings of Black Ops II.",
            "The Nuke's Debut: Modern Warfare 2 (2009) was the first game to introduce the Tactical Nuke—an instant-win killstreak unlocked at 25 consecutive kills without dying.",
            "The First Dog Killstreak: World at War introduced Attack Dogs as a 7-killstreak, which became so iconic that Treyarch brought them back in multiple subsequent titles.",
            "Nuketown’s Constant Remakes: Nuketown is the most remade map in CoD history, appearing in every single main Black Ops entry in a different thematic design.",
            "The \"Commando\" Knife Lunge: Modern Warfare 2's \"Commando Pro\" perk famously allowed players to lunge long distances to knife an opponent instantly.",
            "The \"Martyrdom\" Outrage: Call of Duty 4: Modern Warfare (2007) sparked community debate over the \"Martyrdom\" perk, which automatically dropped a live grenade upon your death.",
            "The \"G-Slide\" Glitch: Black Ops 3 competitive play was heavily defined by the \"G-Slide,\" an unintended movement exploit that propelled players across the map at high speeds.",
            "Highrise’s Crane Secret: The iconic map Highrise featured a notorious ledge parkour route allowing snipers to climb to the very top of the crane overlooking the map.",
            "Real-World Gun Name Changes: Modern CoD titles use fictional weapon names (like \"Lachmann Sub\" instead of MP5) to avoid paying licensing fees to firearm manufacturers.",
            "The AC-130 Audio: The dialogue for the AC-130 gunship mission in Call of Duty 4 was scripted and performed by voice actors using authentic military radio protocols and filters inspired by real combat footage.",
            "The \"Juggernaut\" Inspiration: The heavily armored Juggernauts were inspired by the bank robbers in the real-life 1997 North Hollywood Shootout.",
            "Real Military Consultants: Infinity Ward hired former military personnel, including Navy SEALs and Army Rangers, to motion-capture tactical reloads and realistic combat movement.",
            "The Origin of \"F to Pay Respects\": The infamous internet meme originated from Advanced Warfare’s opening funeral scene where PC players were prompted to \"Press F to Pay Respects.\"",
            "The Guinness World Record: Call of Duty holds the Guinness World Record for the best-selling first-person shooter franchise of all time.",
            "Eminem’s CoD Anthems: Eminem featured his track \"Won't Back Down\" in the Black Ops 1 trailer and later dropped \"Survival\" alongside the Call of Duty: Ghosts reveal.",
            "Snoop Dogg Voice Pack: Ghosts (2013) let players buy an official DLC voice pack where Snoop Dogg narrated multiplayer announcements.",
            "Metallica’s Live Concert: Activision hired Metallica to play a full private concert at the inaugural \"Call of Duty XP\" fan convention in Los Angeles in 2011.",
            "Die Hard’s Nakatomi Plaza: Warzone officially recreated Nakatomi Plaza from Die Hard inside Verdansk during an '80s Action Heroes crossover event.",
            "First CoD with No Campaign: Black Ops 4 (2018) was the very first main-series Call of Duty title shipped without a traditional single-player narrative campaign.",
            "Blackout’s Battle Royale Debut: Black Ops 4 introduced \"Blackout,\" Activision’s first AAA Battle Royale mode before Warzone was released.",
            "Infinite Warfare's YouTube Record: The debut trailer for Infinite Warfare (2016) became one of the most disliked YouTube videos in history, amassing over 3.9 million dislikes.",
            "The Real Ghost Mask: Ghost’s original skull pattern was hand-painted onto a standard balaclava by animator/character designer Mark Grigsby using fabric paint.",
            "First Playable Female Soldiers: Call of Duty: Ghosts was the first main-series title to feature playable female soldier options in multiplayer.",
            "The FOV Revolution: Modern Warfare II (2022) brought a comprehensive Field of View (FOV) slider to console players matching PC customization options across all console platforms.",
            "CoD Online (China Exclusive): Activision developed a free-to-play version called Call of Duty Online exclusively for China (2015–2021) featuring Cyborg Zombies and robotic mercenaries.",
            "The Ricochet Anti-Cheat: Kernel-level anti-cheat \"Ricochet\" introduced mitigation mechanics to troll cheaters, such as making enemy targets completely invisible to them or disarming them mid-game.",
            "The Original CoD Engine: The 2003 original Call of Duty was built on a heavily modified version of id Software’s id Tech 3 engine—the same engine that powered Quake III Arena.",
            "Treyarch's CoD Debut: Treyarch's first main entry was Call of Duty 3 (2006), which was famously developed in an intense, rushed timeframe of around eight months.",
            "The Secret Modern Warfare Prototype: Before pitching CoD4, Infinity Ward secretly built a modern combat tech demo using WWII assets where soldiers fought with modern red-dot sights attached to M1 Garand rifles.",
            "CoD 2's Launch Dominance: Call of Duty 2 was the top-selling launch title for the Xbox 360 in 2005, with an attach rate of over 77% among early console buyers.",
            "The WWII \"Red Big One\" Legacy: Call of Duty 2: Big Red One (2005) was narrated by actor Mark Hamill.",
            "Hans Zimmer’s Main Theme: Film composer Hans Zimmer composed the main theme for Modern Warfare 2 (2009)—his first work for a video game—while the full in-game score was composed by Lorne Balfe.",
            "Stephen Barton’s CoD4 Score: Composer Stephen Barton crafted the original tactical soundtrack for Call of Duty 4: Modern Warfare under the mentorship of Harry Gregson-Williams.",
            "The Authentic Gun Foley: To record realistic weapon sounds for Modern Warfare (2019), audio designers traveled to desert firing ranges, placing dozens of microphones around weapons at various distances to capture real acoustics.",
            "David Bowie’s Zombies Tribute: The Zombies map Der Riese in World at War features hidden radios playing audio clips, including Easter egg references to classic rock and David Bowie.",
            "Brian Tyler’s MW3 Score: Hollywood composer Brian Tyler composed the complete orchestral score for Modern Warfare 3 (2011).",
            "The Teddy Bear Location Secret: In CoD4 and MW2, mystery teddy bears were placed by level designers as \"out-of-bounds\" markers and inside map easter eggs.",
            "The \"Mile High Club\" Password: In CoD4's \"Mile High Club,\" the dialogue spoken by the assault team directly reflects authentic counter-terrorism breach callouts.",
            "The Giant Robot Names: The three giant robots patrolling the Black Ops II Zombies map Origins are named Freya, Thor, and Odin after Norse deities.",
            "Verrückt’s Real-World Location: The World at War Zombies map Verrückt is modeled directly after the real-world Wittenau Asylum (Nervenheilanstalt Wittenau) in Berlin.",
            "The Terminal Easter Egg: In Black Ops 1, entering specific terminal commands in the main menu computer reveals hidden text files and secret unlockable content.",
            "The IW Engine Evolution: Infinity Ward developed their own proprietary engine (IW Engine) starting with CoD2, which introduced dynamic smoke, weather effects, and squad pathfinding.",
            "Photogrammetry Upgrade: Modern Warfare (2019) introduced an overhauled engine utilizing photogrammetry—scanning real-world objects and materials to render photo-realistic environments.",
            "Killstreak System Debut: Call of Duty 4: Modern Warfare popularized the persistent, stackable killstreak system (UAV at 3, Airstrike at 5, Helicopter at 7).",
            "Create-a-Class Pick 10: Black Ops II introduced the \"Pick 10\" system, allowing players to trade weapon attachments for extra perks or equipment.",
            "First Dynamic Map Destruction: Call of Duty: Ghosts introduced \"Field Orders\" and dynamic map changes, such as the collapsing skyscraper on the map Strikezone.",
            "Warzone's Original Player Cap: When Warzone launched in March 2020, it featured a 150-player lobby count, which was later temporarily expanded to 200 players in special limited-time modes.",
            "The Gulag 1v1 Mechanic: Warzone introduced the \"Gulag\" mechanic, giving eliminated players a 1v1 second-chance gunfight to redeploy into the match.",
            "Verdansk's Real-World Architecture: The original Verdansk map featured landmarks directly modeled after real-world locations, such as the Donetsk International Airport and the Dnipro Arena in Ukraine.",

        // DAILY FACT SYSTEM LOGIC
        function loadDailyFact() {
            const todayStr = new Date().toISOString().split('T')[0]; // Format YYYY-MM-DD
            let lastFactDate = localStorage.getItem('codzone_fact_date');
            let currentFactIndex = parseInt(localStorage.getItem('codzone_fact_index'));

            if (isNaN(currentFactIndex)) {
                currentFactIndex = 0;
                localStorage.setItem('codzone_fact_index', 0);
                localStorage.setItem('codzone_fact_date', todayStr);
            } else if (lastFactDate !== todayStr) {
                // Posun na ďalší fakt pri novom dni
                currentFactIndex = (currentFactIndex + 1) % dailyFacts.length;
                localStorage.setItem('codzone_fact_index', currentFactIndex);
                localStorage.setItem('codzone_fact_date', todayStr);
            }

            const factEl = document.getElementById('daily-fact-text');
            if (factEl && dailyFacts[currentFactIndex]) {
                factEl.innerText = dailyFacts[currentFactIndex];
            }
        }

        function renderMeta() {
            const container = document.getElementById('meta-container');
            if (!container) return;

            let html = '';
            metaGuns.forEach(gunName => {
                const formattedName = gunName.replace(/[^a-zA-Z0-9]/g, '_');
                const imgPath = `images/weapons/${formattedName}.png`;

                html += `
                    <div class="meta-card" onclick="selectMetaGun('${gunName}')">
                        <div class="meta-title">${gunName}</div>
                        <div class="meta-img-box">
                            <img src="${imgPath}" alt="${gunName}" onerror="this.src='https://via.placeholder.com/300x100/141923/00c4b4?text=${encodeURIComponent(gunName)}'">

                        <div class="meta-action">Open Loadout ➔</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // PREKLIK Z META DO LOADOUTU
        function selectMetaGun(gunName) {
            let foundCategory = 'ar';
            for (const cat in weaponsDatabase) {
                if (weaponsDatabase[cat].includes(gunName)) {
                    foundCategory = cat;
                    break;
                }
            }

            const catSelect = document.getElementById('category');
            catSelect.value = foundCategory;
            
            updateWeaponList();
            document.getElementById('weapon').value = gunName;

            document.getElementById('result').style.display = 'none';

            switchTab('loadout');
        }

        // 7. NAČÍTANIE ZBRANÍ PODĽA KATEGÓRIE
        function updateWeaponList() {
            const categoryEl = document.getElementById('category');
            const weaponSelect = document.getElementById('weapon');

            if (!categoryEl || !weaponSelect) return;

            const category = categoryEl.value;
            weaponSelect.innerHTML = '';

            weaponsDatabase[category].forEach(gun => {
                const opt = document.createElement('option');
                opt.value = gun;
                opt.textContent = gun;
                weaponSelect.appendChild(opt);
            });

            if (weaponSelect.options.length > 0) {
                weaponSelect.selectedIndex = 0;
            }
        }

        // 8. GENERUJE A VYKRESLÍ LOADOUT
        function generateLoadout() {
            const selectedGun = document.getElementById('weapon').value;
            const selectedStyle = document.getElementById('style').value;

            document.getElementById('w-title').innerText = selectedGun;
            document.getElementById('w-style').innerText = selectedStyle.toUpperCase() + " BUILD";
            
            const formattedName = selectedGun.replace(/[^a-zA-Z0-9]/g, '_');
            document.getElementById('w-img').src = `images/weapons/${formattedName}.png`;

            let attachments = [];
            
            if (buildsDatabase[selectedGun] && 
                buildsDatabase[selectedGun][selectedStyle] && 
                buildsDatabase[selectedGun][selectedStyle].length > 0 &&
                buildsDatabase[selectedGun][selectedStyle][0].name !== "") {
                
                attachments = buildsDatabase[selectedGun][selectedStyle];
            } else {
                attachments = [
                    { slot: "Status", name: "Build coming soon! 🔥" }
                ];
            }

            let html = '';
            attachments.forEach(att => {
                html += `
                    <div class="att-item">
                        <span class="att-slot">${att.slot}</span>
                        <span class="att-name">${att.name}</span>
                    </div>
                `;
            });

            const resultCard = document.getElementById('result');
            document.getElementById('att-container').innerHTML = html;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 9. GENERUJE A VYKRESLÍ PERKY
        function generatePerks() {
            const selectedStyle = document.getElementById('perk-style').value;
            document.getElementById('p-style-title').innerText = selectedStyle.toUpperCase();

            const perks = perksDatabase[selectedStyle] || [];
            let html = '';

            perks.forEach(perk => {
                let descHtml = '';
                if (Array.isArray(perk.desc)) {
                    descHtml = '<ul class="perk-desc-list">' + 
                        perk.desc.map(item => `<li>• ${item}</li>`).join('') + 
                        '</ul>';
                } else {
                    descHtml = `<div class="perk-desc">${perk.desc}</div>`;
                }

                html += `
                    <div class="perk-card">
                        <div class="perk-header">
                            <span class="perk-name">${perk.name}</span>
                            <span class="perk-slot">${perk.slot}</span>
                        </div>
                        ${descHtml}
                    </div>
                `;
            });

            const resultCard = document.getElementById('perk-result');
            document.getElementById('perks-container').innerHTML = html;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 10. GENERUJE A VYHODNOCUJE QUIZ
        function renderQuiz() {
            const container = document.getElementById('quiz-questions-container');
            if (!container) return;

            let html = '';
            quizQuestions.forEach((qObj, index) => {
                html += `
                    <div class="quiz-question-block">
                        <span class="quiz-q-num">Question ${index + 1} of 10</span>
                        <div class="quiz-q-text">${qObj.q}</div>
                        <select id="quiz-q-${index}" onchange="checkQuizCompletion()">
                            <option value="" disabled selected>Select your answer...</option>
                            ${qObj.options.map(opt => `<option value="${opt.style}">${opt.text}</option>`).join('')}
                        </select>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function checkQuizCompletion() {
            let allAnswered = true;
            for (let i = 0; i < quizQuestions.length; i++) {
                const val = document.getElementById(`quiz-q-${i}`).value;
                if (!val) {
                    allAnswered = false;
                    break;
                }
            }
            document.getElementById('quiz-submit-btn').disabled = !allAnswered;
        }

        function calculateQuizResult() {
            const counts = { precision: 0, aggressive: 0, movement: 0, camping: 0 };
            
            for (let i = 0; i < quizQuestions.length; i++) {
                const selected = document.getElementById(`quiz-q-${i}`).value;
                if (selected && counts.hasOwnProperty(selected)) {
                    counts[selected]++;
                }
            }

            let winningStyle = 'precision';
            let maxCount = -1;
            for (const style in counts) {
                if (counts[style] > maxCount) {
                    maxCount = counts[style];
                    winningStyle = style;
                }
            }

            document.getElementById('q-style-title').innerText = winningStyle.toUpperCase();
            document.getElementById('q-style-desc').innerHTML = styleDescriptions[winningStyle];

            const resultCard = document.getElementById('quiz-result');
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
