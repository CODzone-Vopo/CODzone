<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODzone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #141923;
            --accent-turquoise: #00c4b4;
            --accent-gold: #d4af37;
            --text-white: #ffffff;
            --text-muted: #8a94a6;
            --border-color: #202736;
        }

        * { box-sizing: border-box; font-family: 'Black Ops One', cursive, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-white); padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; }
        
        /* Header & Logo */
        .header { text-align: center; margin-bottom: 15px; padding: 10px 0; }
        .logo-img { max-width: 220px; height: auto; margin-bottom: 5px; }
        
        /* Navigation Tabs */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px 5px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-muted); font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; transition: 0.2s; text-align: center; }
        .tab-btn.active { background: var(--accent-turquoise); color: #000; border-color: var(--accent-turquoise); }

        /* Sections Visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Cards & Form */
        .card { background: var(--card-bg); border-radius: 12px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--accent-turquoise); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #1c2331; color: var(--text-white); font-size: 15px; margin-bottom: 15px; outline: none; }
        select:focus { border-color: var(--accent-turquoise); }
        
        /* Action Buttons */
        .btn-build { width: 100%; padding: 14px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--accent-turquoise), #009688); color: #000; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.2s; }
        .btn-build:active { transform: scale(0.98); }
        .btn-build:disabled { background: #2a3447; color: #5a6578; cursor: not-allowed; transform: none; }

        /* Quiz Specific Styling */
        .quiz-question-block { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .quiz-question-block:last-child { border-bottom: none; margin-bottom: 10px; }
        .quiz-q-num { color: var(--accent-gold); font-size: 12px; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .quiz-q-text { color: var(--text-white); font-size: 14px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }

        /* Output / Result Box */
        .result-box { display: none; border-top: 3px solid var(--accent-gold); }
        .section-title { color: var(--accent-gold); font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 3px; text-transform: uppercase; }
        .style-badge { text-align: center; font-size: 12px; color: var(--accent-turquoise); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .style-desc-box { background: #1c2331; border-radius: 8px; padding: 15px; border-left: 3px solid var(--accent-gold); color: var(--text-muted); font-size: 14px; line-height: 1.5; }

        /* Weapon Image Container */
        .weapon-img-box { text-align: center; margin-bottom: 15px; min-height: 100px; display: flex; align-items: center; justify-content: center; background: #0e121a; border-radius: 8px; padding: 10px; border: 1px dashed var(--border-color); }
        .weapon-img-box img { max-width: 100%; max-height: 120px; object-fit: contain; }

        /* Attachments & Perks List */
        .att-list, .perks-list { list-style: none; }
        .att-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .att-item:last-child { border-bottom: none; }
        .att-slot { color: var(--text-muted); font-weight: 600; }
        .att-name { color: var(--text-white); font-weight: bold; text-align: right; }

        /* Perk Card styling */
        .perk-card { padding: 12px; background: #1c2331; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--accent-turquoise); }
        .perk-card:last-child { margin-bottom: 0; }
        .perk-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .perk-slot { color: var(--accent-gold); font-size: 12px; text-transform: uppercase; }
        .perk-name { color: var(--text-white); font-size: 15px; }
        .perk-desc-list { list-style: none; padding-left: 0; margin-top: 5px; }
        .perk-desc-list li { color: var(--text-muted); font-size: 13px; line-height: 1.5; }
    </style>
</head>

    <div class="app-container">

        <!-- NAVIGATION TABS -->

            <button id="tab-loadout-btn" class="tab-btn active" onclick="switchTab('loadout')">Loadouts</button>
            <button id="tab-perks-btn" class="tab-btn" onclick="switchTab('perks')">Perks</button>
            <button id="tab-quiz-btn" class="tab-btn" onclick="switchTab('quiz')">Find Your Style</button>
        </div>

        <!-- LOADOUT SECTION -->
        <div id="section-loadout" class="tab-content active">
            <div class="card">
                <label for="category">1. Category:</label>
                <select id="category" onchange="updateWeaponList()">
                    <option value="ar">Assault Rifles (AR)</option>
                    <option value="smg">Submachine Guns (SMG)</option>
                    <option value="sniper">Sniper Rifles</option>
                </select>

                <label for="weapon">2. Weapon:</label>
                <select id="weapon">
                    <!-- Zbrane sa dopĺňajú automaticky z JavaScriptu -->
                </select>

                <label for="style">3. Your Playstyle:</label>
                <select id="style">
                    <option value="precision">Precision</option>
                    <option value="aggressive">Aggressive</option>
                    <option value="movement">Movement</option>
                    <option value="camping">Camping</option>
                </select>

                <button class="btn-build" onclick="generateLoadout()">Generate Loadout 🔥</button>
            </div>

            <!-- LOADOUT RESULTS CARD -->
            <div id="result" class="card result-box">
                <div id="w-title" class="section-title">AN-94</div>
                <div id="w-style" class="style-badge">PRECISION BUILD</div>

                <!-- Obrázok zbrane -->
                <div class="weapon-img-box">
                    <img id="w-img" src="" alt="Weapon Image" onerror="this.src='https://via.placeholder.com/300x100/141923/00c4b4?text=Weapon+Image'">
                </div>

                <!-- Zoznam Attachmentov -->
                <div id="att-container" class="att-list"></div>
            </div>
        </div>

        <!-- PERKS SECTION -->
        <div id="section-perks" class="tab-content">
            <div class="card">
                <label for="perk-style">Select Your Playstyle:</label>
                <select id="perk-style">
                    <option value="precision">Precision</option>
                    <option value="aggressive">Aggressive</option>
                    <option value="movement">Movement</option>
                    <option value="camping">Camping</option>
                </select>

                <button class="btn-build" onclick="generatePerks()">Get Perk Setup ⚡</button>
            </div>

            <!-- PERKS RESULTS CARD -->
            <div id="perk-result" class="card result-box">
                <div id="p-style-title" class="section-title">PRECISION</div>
                <div class="style-badge">RECOMMENDED PERKS</div>

                <div id="perks-container" class="perks-list"></div>
            </div>
        </div>

        <!-- FIND YOUR STYLE (QUIZ) SECTION -->
        <div id="section-quiz" class="tab-content">
            <div class="card">
                <div id="quiz-questions-container">
                    <!-- 10 otázok sa vygeneruje cez JavaScript -->
                </div>
                <button id="quiz-submit-btn" class="btn-build" onclick="calculateQuizResult()" disabled>Complete All Questions</button>
            </div>

            <!-- QUIZ RESULT CARD -->

                <div id="q-style-title" class="section-title">YOUR PLAYSTYLE</div>
                <div class="style-badge">PLAYSTYLE ANALYSIS</div>
                <div id="q-style-desc" class="style-desc-box"></div>
            </div>
        </div>

    </div>

        // 6. NAČÍTANIE ZBRANÍ PODĽA KATEGÓRIE
        function updateWeaponList() {
            const categoryEl = document.getElementById('category');
            const weaponSelect = document.getElementById('weapon');

            if (!categoryEl || !weaponSelect) return;

            const category = categoryEl.value;
            weaponSelect.innerHTML = '';

            weaponsDatabase[category].forEach(gun => {
                const opt = document.createElement('option');
                opt.value = gun;
                opt.textContent = gun;
                weaponSelect.appendChild(opt);
            });
        }

        // 7. GENERUJE A VYKRESLÍ LOADOUT
        function generateLoadout() {
            const selectedGun = document.getElementById('weapon').value;
            const selectedStyle = document.getElementById('style').value;

            document.getElementById('w-title').innerText = selectedGun;
            document.getElementById('w-style').innerText = selectedStyle.toUpperCase() + " BUILD";
            
            const formattedName = selectedGun.replace(/[^a-zA-Z0-9]/g, '_');
            document.getElementById('w-img').src = `images/weapons/${formattedName}.png`;

            let attachments = [];
            
            if (buildsDatabase[selectedGun] && 
                buildsDatabase[selectedGun][selectedStyle] && 
                buildsDatabase[selectedGun][selectedStyle].length > 0 &&
                buildsDatabase[selectedGun][selectedStyle][0].name !== "") {
                
                attachments = buildsDatabase[selectedGun][selectedStyle];
            } else {
                attachments = [
                    { slot: "Status", name: "Build coming soon! 🔥" }
                ];
            }

            let html = '';
            attachments.forEach(att => {
                html += `
                    <div class="att-item">
                        <span class="att-slot">${att.slot}</span>
                        <span class="att-name">${att.name}</span>
                    </div>
                `;
            });

            const resultCard = document.getElementById('result');
            document.getElementById('att-container').innerHTML = html;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 8. GENERUJE A VYKRESLÍ PERKY
        function generatePerks() {
            const selectedStyle = document.getElementById('perk-style').value;
            document.getElementById('p-style-title').innerText = selectedStyle.toUpperCase();

            const perks = perksDatabase[selectedStyle] || [];
            let html = '';

            perks.forEach(perk => {
                let descHtml = '';
                if (Array.isArray(perk.desc)) {
                    descHtml = '<ul class="perk-desc-list">' + 
                        perk.desc.map(item => `<li>• ${item}</li>`).join('') + 
                        '</ul>';
                } else {
                    descHtml = `<div class="perk-desc">${perk.desc}</div>`;
                }

                html += `
                    <div class="perk-card">
                        <div class="perk-header">
                            <span class="perk-name">${perk.name}</span>
                            <span class="perk-slot">${perk.slot}</span>
                        </div>
                        ${descHtml}
                    </div>
                `;
            });

            const resultCard = document.getElementById('perk-result');
            document.getElementById('perks-container').innerHTML = html;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 9. REKREÁCIA A VYHODNOTENIE "FIND YOUR STYLE" KVÍZU
        function renderQuiz() {
            const container = document.getElementById('quiz-questions-container');
            if (!container) return;

            let html = '';
            quizQuestions.forEach((qObj, index) => {
                html += `
                    <div class="quiz-question-block">
                        <span class="quiz-q-num">Question ${index + 1} of 10</span>
                        <div class="quiz-q-text">${qObj.q}</div>
                        <select id="quiz-q-${index}" onchange="checkQuizCompletion()">
                            <option value="" disabled selected>-- Select an answer --</option>
                            ${qObj.options.map((opt, oIdx) => `<option value="${opt.style}">${opt.text}</option>`).join('')}
                        </select>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function checkQuizCompletion() {
            let allAnswered = true;
            for (let i = 0; i < quizQuestions.length; i++) {
                const val = document.getElementById(`quiz-q-${i}`).value;
                if (!val) {
                    allAnswered = false;
                    break;
                }
            }

            const btn = document.getElementById('quiz-submit-btn');
            if (allAnswered) {
                btn.disabled = false;
                btn.innerText = "Find My Playstyle 🎯";
            } else {
                btn.disabled = true;
                btn.innerText = "Complete All Questions";
            }
        }

        function calculateQuizResult() {
            const scores = { precision: 0, aggressive: 0, movement: 0, camping: 0 };

            for (let i = 0; i < quizQuestions.length; i++) {
                const val = document.getElementById(`quiz-q-${i}`).value;
                if (val && scores.hasOwnProperty(val)) {
                    scores[val]++;
                }
            }

            // Nájdenie štýlu s najvyšším skóre
            let topStyle = 'precision';
            let maxScore = -1;

            for (const style in scores) {
                if (scores[style] > maxScore) {
                    maxScore = scores[style];
                    topStyle = style;
                }
            }

            // Vykreslenie výsledku
            document.getElementById('q-style-title').innerText = topStyle.toUpperCase();
            document.getElementById('q-style-desc').innerHTML = styleDescriptions[topStyle] || "";

            const resultCard = document.getElementById('quiz-result');
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
